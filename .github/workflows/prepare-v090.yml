name: Prepare v0.9.0 downloads
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-v090.yml']
permissions:
  contents: write
jobs:
  package:
    if: github.actor == 'tekameimoto'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build IntelliJ plugin
        working-directory: intellij-plugin
        run: ./gradlew buildPlugin
      - name: Package and validate downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/stage/compiler release-assets/stage/plugin
          cp teka.py python_style.py standard_modules.py project_tools.py updater.py teka TPLUS_HANDBOOK.md install.sh install.command install.ps1 README.md LICENSE PRIVACY.md release-assets/stage/compiler/
          plugin="$(find intellij-plugin/build/distributions -maxdepth 1 -name '*.zip' -type f -print -quit)"
          test -n "$plugin"
          cp "$plugin" release-assets/stage/plugin/TekaLang-IntelliJ.zip
          cp "$plugin" release-assets/TPlus-IntelliJ-v0.9.0.zip
          (cd release-assets/stage && zip -Xqr ../TPlus-v0.9.0.zip compiler plugin)
          (cd release-assets && sha256sum TPlus-v0.9.0.zip TPlus-IntelliJ-v0.9.0.zip > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          from pathlib import Path
          from updater import validate_bundle
          import io, re, zipfile
          data = Path('release-assets/TPlus-v0.9.0.zip').read_bytes()
          validate_bundle(data, '0.9.0')
          def audit(data):
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  assert not archive.comment
                  for item in archive.infolist():
                      assert '__MACOSX' not in item.filename and '.DS_Store' not in item.filename
                      content = archive.read(item)
                      assert not re.search(rb'/Users/[^/\s]+|-----BEGIN (?:RSA |OPENSSH |EC )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}', content)
                      if zipfile.is_zipfile(io.BytesIO(content)):
                          audit(content)
          audit(data)
          print('Bundle structure and nested archive privacy checks passed.')
          PY
      - name: Create unpublished release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.9.0 release-assets/TPlus-v0.9.0.zip release-assets/TPlus-IntelliJ-v0.9.0.zip release-assets/SHA256SUMS.txt --draft --title 'T+ v0.9.0' --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA"
      - name: Remove temporary preparation workflow
        run: |
          git config user.name 'tekameimoto'
          git config user.email '171989109+tekameimoto@users.noreply.github.com'
          git rm .github/workflows/prepare-v090.yml
          git commit -m 'Remove completed release preparation workflow'
          git push origin HEAD:main
