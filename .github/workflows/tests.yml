name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler:
    name: Compiler tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install C++ toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Run compiler tests
        run: python -m unittest discover -s tests -v

      - name: Check installer
        run: |
          sh -n install.sh
          sh install.sh --prefix "$RUNNER_TEMP/teka install"
          "$RUNNER_TEMP/teka install/bin/teka" --version
          "$RUNNER_TEMP/teka install/bin/teka" update status --json
          "$RUNNER_TEMP/teka install/bin/teka" check examples/start_here.teka

  windows:
    name: Compiler and installer (Windows)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Run compiler tests
        shell: msys2 {0}
        run: |
          cygpath -w "$(dirname "$(which g++)")" >> "$GITHUB_PATH"
          python -m unittest discover -s tests -v
      - name: Install and run a Windows executable
        shell: pwsh
        run: |
          ./install.ps1 -Prefix "$env:RUNNER_TEMP/TPlus test"
          $teka = "$env:RUNNER_TEMP/TPlus test/bin/teka.cmd"
          & $teka --version
          if ($LASTEXITCODE -ne 0) { throw "Launcher failed" }
          & $teka update status --json
          if ($LASTEXITCODE -ne 0) { throw "Update launcher failed" }
          & $teka run examples/hello.teka
          if ($LASTEXITCODE -ne 0) { throw "Program failed" }
          & $teka build examples/hello.teka -o "$env:RUNNER_TEMP/hello"
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
          & "$env:RUNNER_TEMP/hello.exe"
          if ($LASTEXITCODE -ne 0) { throw "Executable failed" }

  intellij:
    name: IntelliJ plugin tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Run plugin tests and build distribution
        run: ./gradlew test buildPlugin
        working-directory: intellij-plugin

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Package and verify repeatability
        run: |
          python tools/package_release.py --plugin intellij-plugin/build/distributions/*.zip --output dist
          python tools/package_release.py --plugin intellij-plugin/build/distributions/*.zip --output dist-repeat
          diff -r dist dist-repeat
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  package-install:
    name: Packaged install (${{ matrix.os }})
    needs: [compiler, windows, intellij]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: candidate
      - name: Verify and extract release
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          from tools.package_release import release_version, verify
          version = release_version(Path.cwd())
          verify(Path('candidate'), version)
          with zipfile.ZipFile(f'candidate/TPlus-v{version}.zip') as archive:
              archive.extractall('unpacked')
      - name: Install packaged compiler (POSIX)
        if: runner.os != 'Windows'
        run: |
          sh unpacked/compiler/install.sh --prefix "$RUNNER_TEMP/packaged teka"
          "$RUNNER_TEMP/packaged teka/bin/teka" --version
          "$RUNNER_TEMP/packaged teka/bin/teka" check examples/hello.teka
          "$RUNNER_TEMP/packaged teka/bin/teka" uninstall --yes
      - name: Install packaged compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./unpacked/compiler/install.ps1 -Prefix "$env:RUNNER_TEMP/packaged teka" -NoPath
          $teka = "$env:RUNNER_TEMP/packaged teka/bin/teka.cmd"
          & $teka --version
          if ($LASTEXITCODE -ne 0) { throw "Packaged launcher failed" }
          & $teka check examples/hello.teka
          if ($LASTEXITCODE -ne 0) { throw "Packaged compiler failed" }
          & $teka uninstall --yes
          if ($LASTEXITCODE -ne 0) { throw "Packaged uninstall failed" }
