name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler:
    name: Compiler tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install C++ toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Run compiler tests
        run: python -m unittest discover -s tests -v

      - name: Check installer
        run: |
          sh -n install.sh
          sh install.sh --prefix "$RUNNER_TEMP/teka install"
          "$RUNNER_TEMP/teka install/bin/teka" --version
          "$RUNNER_TEMP/teka install/bin/teka" update status --json
          "$RUNNER_TEMP/teka install/bin/teka" check examples/start_here.teka

  windows:
    name: Compiler and installer (Windows)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Run compiler tests
        shell: msys2 {0}
        run: |
          cygpath -w "$(dirname "$(which g++)")" >> "$GITHUB_PATH"
          python -m unittest discover -s tests -v
      - name: Install and run a Windows executable
        shell: pwsh
        run: |
          ./install.ps1 -Prefix "$env:RUNNER_TEMP/TPlus test"
          $teka = "$env:RUNNER_TEMP/TPlus test/bin/teka.cmd"
          & $teka --version
          if ($LASTEXITCODE -ne 0) { throw "Launcher failed" }
          & $teka update status --json
          if ($LASTEXITCODE -ne 0) { throw "Update launcher failed" }
          & $teka run examples/hello.teka
          if ($LASTEXITCODE -ne 0) { throw "Program failed" }
          & $teka build examples/hello.teka -o "$env:RUNNER_TEMP/hello"
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
          & "$env:RUNNER_TEMP/hello.exe"
          if ($LASTEXITCODE -ne 0) { throw "Executable failed" }

  intellij:
    name: IntelliJ plugin tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Run plugin tests
        run: ./gradlew test
        working-directory: intellij-plugin
